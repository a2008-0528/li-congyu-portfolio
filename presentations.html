<main><section class="hero"><div><p class="eyebrow">AI PRESENTATION DESIGNER / AI演示设计师</p><h1>让内容，有清晰的表达。</h1><p class="hero-en">Ideas, arranged with intention.</p></div><p class="hero-note">两份演示作品，分别面向课堂精读与项目路演。<br>在每份介绍下方翻阅原稿，或下载 PPT 查看。</p></section><nav class="index-nav" aria-label="作品导航"><a href="#reading"><span>01</span>英语精读展示</a><a href="#heheng"><span>02</span>禾衡 · 创新大赛路演示例</a></nav>

<script>
'use strict';
const decks=[{id:'reading',index:'01',type:'CLASSROOM / 课堂展示',title:'The Weight of Choices',subtitle:'大学英语阅读 · Paragraph 3 精读展示',description:'这份 9 页的课堂展示围绕大一新生面对众多选择时的压力展开，从原文呈现进入重点词汇、长难句分析，再梳理段落主旨与写作手法，最后以课堂讨论和词汇回顾收束。中英文内容相互对应，将“分析瘫痪”与“冲动决定”两种反应放在同一阅读框架下，适合用于精读讲解和课堂交流。',tags:['中英双语','词汇与句法','课堂互动'],file:'presentation-assets/英语精读展示.pptx',size:'398 KB',titles:['封面 · The Weight of Choices','原文呈现 · Paragraph 3','重点词汇 ①','重点词汇 ②','长难句 ① · 选择的重量','长难句 ② · 挥之不去的问题','段落主旨与作用','课堂讨论 · Which Trap Catches You?','总结 · 词汇回顾']},{id:'heheng',index:'02',type:'PITCH DECK / 项目路演',title:'禾衡 · 高校食堂智能减损助手',subtitle:'中国国际大学生创新大赛 · 项目路演示例',description:'这份 16 页路演示例以高校食堂按需备餐与减少剩餐为主题，提出将菜品销量、备餐量及剩餐记录用于下一餐决策的方案。内容从需求与政策背景展开，覆盖产品流程、技术路线、替代方案比较、调研与试点计划，并通过商业模式、财务假设、团队分工及执行计划组织路演叙事，展示概念项目如何形成完整的表达结构。',note:'概念项目路演示例：材料中的调研、模型、试点指标与财务数字属于待验证计划或演示假设，不代表已经取得的项目成果。',tags:['项目叙事','方案可视化','商业与财务表达'],file:'presentation-assets/禾衡_创新大赛路演示例.pptx',size:'1.85 MB',titles:['封面 · 禾衡','需求与问题','机会与切入点','产品方案','技术路线','替代方案比较','调研与试点计划','验证指标','商业模式','市场进入路径','单食堂经济测算','财务假设','团队与学习成长','执行计划','社会价值与风险','结束页 · 所需资源']}];
const galleryStates=[],dialog=document.getElementById('slide-dialog');let activeGallery=null,returnFocus=null;
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function src(deck,index){return 'presentation-assets/'+deck.id+'/slide-'+(index+1)+'.jpg'}
function updateDialog(){const s=activeGallery;if(!s)return;document.getElementById('dialog-title').textContent=s.deck.title+' · '+s.deck.titles[s.index];const image=document.getElementById('dialog-image');image.src=src(s.deck,s.index);image.alt=s.deck.title+'，第'+(s.index+1)+'页：'+s.deck.titles[s.index];document.getElementById('dialog-count').textContent=(s.index+1)+' / '+s.deck.titles.length;document.getElementById('dialog-prev').disabled=s.index===0;document.getElementById('dialog-next').disabled=s.index===s.deck.titles.length-1}
function openGallery(state,trigger){activeGallery=state;returnFocus=trigger;updateDialog();document.body.style.overflow='hidden';dialog.showModal()}
decks.forEach(deck=>{const state={deck,index:0},project=node('section','project');project.id=deck.id;project.setAttribute('aria-labelledby',deck.id+'-title');const intro=node('div','project-intro'),label=node('div','project-label',deck.index+' /');label.append(node('small','',deck.type));const text=node('div'),heading=node('h2','',deck.title);heading.id=deck.id+'-title';text.append(heading,node('p','subtitle',deck.subtitle),node('p','description',deck.description));const tags=node('div','tags');deck.tags.forEach(t=>tags.append(node('span','tag',t)));text.append(tags);if(deck.note)text.append(node('p','concept',deck.note));intro.append(label,text);project.append(intro);
 const viewer=node('div','viewer'),top=node('div','viewer-top'),expand=node('button','expand','放大预览 ↗');expand.type='button';top.append(node('span','','ORIGINAL SLIDES / '+deck.titles.length+' 页原稿'),expand);const stage=node('button','stage');stage.type='button';stage.setAttribute('aria-haspopup','dialog');const image=node('img','slide-image');image.width=1440;image.height=810;image.decoding='async';if(deck.id!=='reading')image.loading='lazy';stage.append(image);const controls=node('div','controls'),caption=node('p','slide-caption'),paging=node('div','paging'),prev=node('button','','←'),next=node('button','','→'),counter=node('span','page-count');prev.type=next.type='button';prev.setAttribute('aria-label',deck.title+'上一页');next.setAttribute('aria-label',deck.title+'下一页');counter.setAttribute('aria-live','polite');paging.append(prev,counter,next);controls.append(caption,paging);const strip=node('div','thumbnails');strip.setAttribute('role','group');strip.setAttribute('aria-label',deck.title+'页面缩略图');const thumbs=[];
 state.select=(index)=>{state.index=Math.max(0,Math.min(deck.titles.length-1,index));image.src=src(deck,state.index);image.alt=deck.title+'，第'+(state.index+1)+'页：'+deck.titles[state.index];stage.setAttribute('aria-label',image.alt+'，点击放大');counter.textContent=(state.index+1)+' / '+deck.titles.length;caption.textContent=deck.titles[state.index];prev.disabled=state.index===0;next.disabled=state.index===deck.titles.length-1;thumbs.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.index)));if(dialog.open&&activeGallery===state)updateDialog()};
 deck.titles.forEach((title,i)=>{const thumb=node('button','thumbnail');thumb.type='button';thumb.setAttribute('aria-label','第'+(i+1)+'页：'+title);const img=node('img');img.src=src(deck,i);img.alt='';img.width=160;img.height=90;img.loading='lazy';img.decoding='async';thumb.append(img,node('span','',String(i+1).padStart(2,'0')));thumb.onclick=()=>state.select(i);strip.append(thumb);thumbs.push(thumb)});prev.onclick=()=>state.select(state.index-1);next.onclick=()=>state.select(state.index+1);stage.onclick=()=>openGallery(state,stage);expand.onclick=()=>openGallery(state,expand);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.select(state.index+(e.key==='ArrowRight'?1:-1))}});viewer.append(top,stage,controls,strip);project.append(viewer);const downloads=node('div','downloads'),download=node('a','download','下载 PPT 原文件');download.href=deck.file;download.setAttribute('download','');download.append(node('span','','↓'));downloads.append(node('span','download-note',deck.titles.length+' 页 / PPTX / '+deck.size),download);project.append(downloads);document.getElementById('projects').append(project);state.select(0);galleryStates.push(state)
});
document.getElementById('dialog-close').onclick=()=>dialog.close();document.getElementById('dialog-prev').onclick=()=>activeGallery.select(activeGallery.index-1);document.getElementById('dialog-next').onclick=()=>activeGallery.select(activeGallery.index+1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();activeGallery.select(activeGallery.index+(e.key==='ArrowRight'?1:-1))}});dialog.addEventListener('close',()=>{document.body.style.overflow='';returnFocus?.focus({preventScroll:true})});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
</script></body></html>
